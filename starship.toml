format = """
[╭─](bold #7df9ff)${custom.cockpit_segments}
[╰─](bold #7df9ff)$character"""

right_format = "$time$status"
add_newline = true
command_timeout = 1200

palette = "cockpit"

[palettes.cockpit]
cyan = "#7df9ff"
blue = "#5da9ff"
purple = "#bd93f9"
pink = "#ff79c6"
green = "#50fa7b"
yellow = "#f1fa8c"
orange = "#ffb86c"
red = "#ff5555"
gray = "#6c7086"
dark = "#1e1e2e"

[os]
disabled = false
style = "bg:cyan fg:dark bold"
format = "[ $symbol ]($style)"

[os.symbols]
Ubuntu = ""
Windows = ""
Linux = ""

[username]
show_always = false
style_user = "bg:green fg:dark bold"
style_root = "bg:red fg:dark bold"
format = "[ $user ]($style)"

[hostname]
ssh_only = true
style = "bg:purple fg:dark bold"
format = "[@$hostname ]($style)"

[directory]
style = "bg:blue fg:dark bold"
read_only = " 󰌾"
truncation_length = 4
truncate_to_repo = false
format = "[  $path$read_only ]($style)"

[git_branch]
symbol = ""
style = "bg:purple fg:dark bold"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "bg:purple fg:dark bold"
format = "[$all_status$ahead_behind ]($style)"
conflicted = "≠"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
untracked = "?${count}"
stashed = "≡${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[nodejs]
symbol = "⬢"
style = "bg:green fg:dark bold"
format = "[ $symbol $version ]($style)"

[bun]
symbol = "🥟"
style = "bg:orange fg:dark bold"
format = "[ $symbol $version ]($style)"

[php]
symbol = ""
style = "bg:purple fg:dark bold"
format = "[ $symbol $version ]($style)"

[python]
symbol = ""
style = "bg:yellow fg:dark bold"
format = "[ $symbol $version( $virtualenv) ]($style)"

[dotnet]
symbol = ""
style = "bg:blue fg:dark bold"
format = "[ $symbol $version ]($style)"

[package]
symbol = "󰏗"
style = "bg:pink fg:dark bold"
format = "[ $symbol $version ]($style)"

[cmd_duration]
min_time = 1500
style = "bg:yellow fg:dark bold"
format = "[ took $duration ]($style)"

[jobs]
symbol = ""
style = "bg:cyan fg:dark bold"
format = "[ $symbol $number ]($style)"

[battery]
full_symbol = "󰁹"
charging_symbol = "󰂄"
discharging_symbol = "󰂃"
format = "[ $symbol $percentage ]($style)"

[[battery.display]]
threshold = 30
style = "bg:red fg:dark bold"

[[battery.display]]
threshold = 60
style = "bg:yellow fg:dark bold"

[custom.cockpit_segments]
description = "Rendered left prompt segments joined with two-step powerline glue"
when = true
shell = ["bash", "--noprofile", "--norc"]
unsafe_no_escape = true
format = "$output"
command = '''
declare -A colors=(
  [os]="125;249;255"
  [username]="80;250;123"
  [hostname]="189;147;249"
  [directory]="93;169;255"
  [git_branch]="189;147;249"
  [git_status]="189;147;249"
  [nodejs]="80;250;123"
  [bun]="255;184;108"
  [php]="189;147;249"
  [python]="241;250;140"
  [dotnet]="93;169;255"
  [package]="255;121;198"
  [cmd_duration]="241;250;140"
  [jobs]="125;249;255"
  [battery]="255;85;85"
)

modules=(os username hostname directory git_branch git_status nodejs bun php python dotnet package cmd_duration jobs battery)
terminal_bg="30;30;46"
prev_color=""
prompt=""

for module in "${modules[@]}"; do
  segment="$(starship module "$module")"
  [[ -n "$segment" ]] || continue

  color="${colors[$module]}"
  if [[ -n "$prev_color" && "$prev_color" != "$color" ]]; then
    prompt+=$'\033[38;2;'"$prev_color"$'m\033[48;2;'"$terminal_bg"$'m'
    prompt+=$'\033[38;2;'"$terminal_bg"$'m\033[48;2;'"$color"$'m\033[0m'
  fi

  prompt+="$segment"
  prev_color="$color"
done

printf '%s' "$prompt"
'''

[time]
disabled = false
time_format = "%H:%M:%S"
style = "fg:gray bold"
format = "[ $time ]($style)"

[status]
disabled = false
symbol = "✘"
format = "[](fg:dark bg:red)[$symbol $status ]($style)"
style = "bg:red fg:dark bold"

[character]
success_symbol = "[❯](bold #50fa7b) "
error_symbol = "[❯](bold #ff5555) "
vimcmd_symbol = "[❮](bold #bd93f9) "
