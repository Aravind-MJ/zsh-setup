format = """
[╭─](bold #7df9ff)$os$username$hostname$directory$git_branch$git_status$nodejs$bun$php$python$dotnet$package$cmd_duration$jobs$battery
[╰─](bold #7df9ff)$character"""

right_format = "$time$status"
add_newline = true
command_timeout = 1200

palette = "cockpit"

[palettes.cockpit]
cyan = "#7df9ff"
blue = "#5da9ff"
purple = "#bd93f9"
pink = "#ff79c6"
green = "#50fa7b"
yellow = "#f1fa8c"
orange = "#ffb86c"
red = "#ff5555"
gray = "#6c7086"
dark = "#1e1e2e"

[os]
disabled = false
style = "bg:cyan fg:dark bold"
format = "[](fg:dark bg:cyan)[ $symbol ]($style)[](fg:cyan bg:dark)"

[os.symbols]
Ubuntu = ""
Windows = ""
Linux = ""

[username]
show_always = false
style_user = "bg:green fg:dark bold"
style_root = "bg:red fg:dark bold"
format = "[](fg:dark bg:green)[ $user ]($style)[](fg:green bg:dark)"

[hostname]
ssh_only = true
style = "bg:purple fg:dark bold"
format = "[](fg:dark bg:purple)[@$hostname ]($style)[](fg:purple bg:dark)"

[directory]
style = "bg:blue fg:dark bold"
read_only = " 󰌾"
truncation_length = 4
truncate_to_repo = false
format = "[](fg:dark bg:blue)[  $path$read_only ]($style)[](fg:blue bg:dark)"

[git_branch]
symbol = ""
style = "bg:purple fg:dark bold"
format = "[](fg:dark bg:purple)[$symbol $branch ]($style)"

[git_status]
style = "bg:purple fg:dark bold"
format = "[$all_status$ahead_behind ]($style)[](fg:purple bg:dark)"
conflicted = "≠"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
untracked = "?${count}"
stashed = "≡${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[nodejs]
symbol = "⬢"
style = "bg:green fg:dark bold"
format = "[](fg:dark bg:green)[ $symbol $version ]($style)[](fg:green bg:dark)"

[bun]
symbol = "🥟"
style = "bg:orange fg:dark bold"
format = "[](fg:dark bg:orange)[ $symbol $version ]($style)[](fg:orange bg:dark)"

[php]
symbol = ""
style = "bg:purple fg:dark bold"
format = "[](fg:dark bg:purple)[ $symbol $version ]($style)[](fg:purple bg:dark)"

[python]
symbol = ""
style = "bg:yellow fg:dark bold"
format = "[](fg:dark bg:yellow)[ $symbol $version( $virtualenv) ]($style)[](fg:yellow bg:dark)"

[dotnet]
symbol = ""
style = "bg:blue fg:dark bold"
format = "[](fg:dark bg:blue)[ $symbol $version ]($style)[](fg:blue bg:dark)"

[package]
symbol = "󰏗"
style = "bg:pink fg:dark bold"
format = "[](fg:dark bg:pink)[ $symbol $version ]($style)[](fg:pink bg:dark)"

[cmd_duration]
min_time = 1500
style = "bg:yellow fg:dark bold"
format = "[](fg:dark bg:yellow)[ took $duration ]($style)[](fg:yellow bg:dark)"

[jobs]
symbol = ""
style = "bg:cyan fg:dark bold"
format = "[](fg:dark bg:cyan)[ $symbol $number ]($style)[](fg:cyan bg:dark)"

[battery]
full_symbol = "󰁹"
charging_symbol = "󰂄"
discharging_symbol = "󰂃"
format = "[ $symbol $percentage ]($style)"

[[battery.display]]
threshold = 30
style = "bg:red fg:dark bold"

[[battery.display]]
threshold = 60
style = "bg:yellow fg:dark bold"

[time]
disabled = false
time_format = "%H:%M:%S"
style = "bg:gray fg:dark bold"
format = "[](fg:dark bg:gray)[ $time ]($style)[](fg:gray bg:dark)"

[status]
disabled = false
symbol = "✘"
format = "[](fg:dark bg:red)[$symbol $status ]($style)[](fg:red bg:dark)"
style = "bg:red fg:dark bold"

[character]
success_symbol = "[❯](bold #50fa7b) "
error_symbol = "[❯](bold #ff5555) "
vimcmd_symbol = "[❮](bold #bd93f9) "
